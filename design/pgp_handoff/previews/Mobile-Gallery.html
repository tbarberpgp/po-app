<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PGP — Phone versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#fbfaf7; --card:#ffffff; --card-2:#f5f2eb;
    --ink:#0f1130; --ink-2:#2a2d50; --muted:#6a6d8a;
    --line:#e6e3da; --line-strong:#c9c4b4;
    --accent:#ee5d2b; --accent-2:#c64b1f; --accent-soft:#fde5d7;
    --navy:#0f1130; --navy-soft:#e3e5f4;
    --blue:#3b5bdb;
    --success:#2f6f4f; --success-soft:#dff0e3;
    --warn:#b06a0e; --warn-soft:#fbe8c4;
    --danger:#b8331f; --danger-soft:#fadbd2;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#23252d; -webkit-font-smoothing:antialiased; padding:30px 20px 80px; }
  .pagehead { text-align:center; color:#fff; margin-bottom:26px; }
  .pagehead h1 { font-family:'Cambria',serif; font-weight:500; font-size:26px; margin:0; }
  .pagehead p { color:rgba(255,255,255,.6); font-size:14px; margin:6px 0 0; }
  .gallery { display:flex; flex-wrap:wrap; gap:30px 26px; justify-content:center; max-width:1500px; margin:0 auto; }
  .frame { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame .lbl { color:rgba(255,255,255,.85); font-size:13px; font-weight:600; }
  .frame .lbl span { color:rgba(255,255,255,.45); font-weight:400; }

  .ph { width:300px; height:620px; background:#000; border-radius:40px; padding:8px; box-shadow:0 24px 50px -16px rgba(0,0,0,.55); }
  .screen { width:100%; height:100%; background:var(--paper); border-radius:32px; overflow:hidden; display:flex; flex-direction:column; }
  .sbar { height:30px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:space-between; padding:0 18px 5px; font-size:11px; font-weight:600; color:var(--ink); }
  .sbar.dk { color:#fff; }

  .mhead { padding:8px 14px 10px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .mhead .eb { font-size:9px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .mhead h2 { font-family:'Cambria',serif; font-weight:500; font-size:18px; margin:1px 0 0; }
  .mhead .sub { font-size:11px; color:var(--muted); }
  .mhead .crumb { font-size:11px; color:var(--accent); font-weight:600; }

  .tabstrip { display:flex; gap:14px; overflow-x:auto; padding:8px 14px 0; border-bottom:1px solid var(--line); flex-shrink:0; }
  .tabstrip span { font-size:12px; font-weight:500; color:var(--muted); padding-bottom:8px; white-space:nowrap; border-bottom:2px solid transparent; }
  .tabstrip span.on { color:var(--ink); border-bottom-color:var(--accent); }

  .mbody { flex:1; overflow-y:auto; padding:12px 14px; }
  .mbody::-webkit-scrollbar { width:0; }

  .tabbar { display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); background:var(--card); flex-shrink:0; padding:7px 0 10px; }
  .tabbar div { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9px; font-weight:600; color:var(--muted); }
  .tabbar div.on { color:var(--accent); }
  .tabbar svg { width:18px; height:18px; }

  .eb { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .muted { color:var(--muted); }
  .pos { color:var(--success); }
  .num { font-variant-numeric:tabular-nums; }
  .kgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .k { border:1px solid var(--line); border-radius:11px; padding:10px 11px; background:var(--card); }
  .k .l { font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; font-weight:600; color:var(--muted); }
  .k .v { font-family:'Cambria',serif; font-size:19px; margin-top:2px; }
  .k .v.pos { color:var(--success); } .k .v.attn { color:var(--warn); }
  .k .s { font-size:10px; color:var(--muted); }

  .card { border:1px solid var(--line); border-radius:12px; background:var(--card); margin-top:10px; overflow:hidden; }
  .card .ch { padding:10px 12px; border-bottom:1px solid var(--line); font-family:'Cambria',serif; font-size:14px; }
  .lr { display:flex; align-items:center; gap:9px; padding:10px 12px; border-top:1px solid var(--line); }
  .lr:first-child { border-top:0; }
  .lr .t { font-weight:600; font-size:12.5px; }
  .lr .s { font-size:11px; color:var(--muted); }
  .lr .av { width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; flex-shrink:0; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; background:var(--line); color:var(--ink-2); white-space:nowrap; }
  .pill.dot::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .pill.success { background:var(--success-soft); color:var(--success); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .pill.navy { background:var(--navy-soft); color:var(--navy); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--navy); border-radius:3px; }
  .bar.warn>i { background:var(--warn); } .bar.success>i { background:var(--success); }
  .dl { font-size:10px; font-weight:700; } .dl.up { color:var(--success); } .dl.down { color:var(--danger); }
  .btn { width:100%; padding:11px; border-radius:11px; border:0; background:var(--accent); color:#fff; font:600 13px 'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:7px; margin-top:10px; }

  /* mini map */
  .mmap { height:120px; border-radius:11px; overflow:hidden; border:1px solid var(--line); position:relative; margin-top:10px; background:#eef1ea; }
  .mpin { position:absolute; transform:translate(-50%,-100%); }
  .mpin i { display:block; width:18px; height:18px; border-radius:50% 50% 50% 0; background:var(--accent); transform:rotate(-45deg); border:2px solid #fff; }
  .mpin.out i { background:var(--muted); }

  /* agenda */
  .ag { display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .ag:first-child { border-top:0; }
  .ag .d { font-family:'Cambria',serif; font-size:13px; min-width:42px; }
  .ag .e { flex:1; font-size:12px; }
</style>
</head>
